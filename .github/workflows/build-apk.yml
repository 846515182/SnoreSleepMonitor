name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 tag 只允许一个构建在跑，避免 --clobber 互相覆盖 Release 资产
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
      # 签名密码必须在构建 Gradle 的步骤可见（signingConfig 通过 System.getenv 读取）
      STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 SDK 已移除 'tools' 包，安装不存在的包会导致 sdkmanager 退出码 1
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Bundle JS into APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      # 签名材料只来自 GitHub Secrets，仓库内不存放任何 keystore / 密码。
      # 首次使用前需在 Settings -> Secrets and variables -> Actions 配置：
      #   RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
      # 密钥一旦曾以任何形式提交过仓库，必须先轮换（见 SECURITY.md）。
      - name: Prepare release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Inject release signing config
        run: |
          cat >> android/app/build.gradle << EOF

          // Release signing (keystore provided via GitHub Secrets, never committed).
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release APK
        id: build-release-apk
        working-directory: ./android
        run: |
          # pipefail: 否则 gradle 失败会被 tee 的退出码 0 掩盖
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --max-workers=1 --stacktrace 2>&1 | tee /tmp/gradle-build.log
        continue-on-error: true

      - name: Print build log tail on failure
        if: steps.build-release-apk.outcome == 'failure'
        run: tail -n 200 /tmp/gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log

      - name: Fail if build failed
        if: steps.build-release-apk.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature
        run: |
          set -o pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          APK=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APK" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: Generate SHA256SUMS
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          APK_DIR=android/app/build/outputs/apk/release
          NOTES_FILE=$(mktemp)
          {
            echo "SnoreSleepMonitor v$VERSION"
            echo
            if [ -f CHANGELOG.md ]; then
              # 提取本版本的变更小节（以 ## v$VERSION 开头到下一个 ## 之间）
              awk -v ver="## v$VERSION" '
                $0 == ver {flag=1; next}
                /^## v/ && flag {flag=0}
                flag {print}
              ' CHANGELOG.md
            fi
            echo
            echo "### 校验"
            echo '```'
            cat "$APK_DIR/SHA256SUMS"
            echo '```'
          } > "$NOTES_FILE"
          gh release create "$TAG" "$APK_DIR/app-release.apk" "$APK_DIR/SHA256SUMS" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
