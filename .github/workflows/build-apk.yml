name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Bundle JS into APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Prepare release keystore
        run: |
          base64 -d release.keystore.b64 > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Inject release signing config
        run: |
          cat >> android/app/build.gradle << 'EOF'

          // Release signing (keystore decoded from release.keystore.b64).
          // NOTE: passwords live in this workflow because this is a personal,
          // self-distributed app; the update channel only trusts releases of
          // this repository, which already requires write access to publish to.
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'Sn0reSleep2026Key'
                      keyAlias 'snoresleep'
                      keyPassword 'Sn0reSleep2026Key'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release APK
        id: build-release-apk
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=1 --stacktrace 2>&1 | tee /tmp/gradle-build.log
        continue-on-error: true

      - name: Print build log tail on failure
        if: steps.build-release-apk.outcome == 'failure'
        run: tail -n 200 /tmp/gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log

      - name: Fail if build failed
        if: steps.build-release-apk.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          APK=android/app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --notes "自动构建版本 $TAG（Release 签名版）" \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi
