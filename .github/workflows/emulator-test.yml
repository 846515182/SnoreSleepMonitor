name: Emulator Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS into APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Build universal debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

  emulator-test:
    runs-on: ubuntu-latest
    needs: build-universal
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Write test script
        run: |
          cat > emulator-test.sh << 'EOF'
          #!/bin/bash
          set -e
          adb wait-for-device
          # sys.boot_completed=1 之后系统服务（PackageManager 等）仍可能在初始化，
          # 轮询等待 pm 可用，避免 "Can't find service: package" 竞态失败。
          echo "Waiting for PackageManager service..."
          for i in $(seq 1 36); do
            if adb shell pm path android >/dev/null 2>&1; then
              echo "PackageManager ready after ~$((i*5))s"
              break
            fi
            sleep 5
          done
          # 安装同样带重试，应对偶发的 adb Broken pipe
          for i in 1 2 3; do
            if adb install -t apk/app-debug.apk; then
              break
            fi
            echo "adb install attempt $i failed, retrying..."
            sleep 10
          done
          adb shell pm grant com.snoresleep.monitor android.permission.RECORD_AUDIO
          adb shell am start -n com.snoresleep.monitor/.MainActivity
          sleep 15
          PID=$(adb shell pidof com.snoresleep.monitor || true)
          if [ -z "$PID" ]; then
            echo "ERROR: com.snoresleep.monitor is not running"
            exit 1
          fi
          echo "App is running, PID=$PID"
          adb logcat -d > logcat.txt || touch logcat.txt
          # Red-screen / JS bundle failure detection: a debug APK without Metro
          # must have loaded the embedded bundle; these signatures mean it did not.
          if grep -qE "Unable to load script|Could not get BatchedBridge|FATAL EXCEPTION" logcat.txt; then
            echo "ERROR: JS bundle failed to load (red screen signatures found in logcat)"
            grep -E "Unable to load script|Could not get BatchedBridge|FATAL EXCEPTION" logcat.txt | head -20
            exit 1
          fi
          echo "JS bundle loaded OK"
          adb shell screencap -p /sdcard/screen.png || true
          adb pull /sdcard/screen.png screen.png || touch screen.png
          EOF
          chmod +x emulator-test.sh

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./emulator-test.sh

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-logs
          path: |
            logcat.txt
            screen.png
