name: Emulator Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 SDK 已移除 'tools' 包，安装不存在的包会导致 sdkmanager 退出码 1
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS into APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Build universal debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

  emulator-test:
    runs-on: ubuntu-latest
    needs: build-universal
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Write test script
        run: |
          cat > emulator-test.sh << 'EOF'
          #!/bin/bash
          set -e
          adb wait-for-device
          # sys.boot_completed=1 之后系统服务（PackageManager 等）仍可能在初始化，
          # 轮询等待 pm 可用，避免 "Can't find service: package" 竞态失败。
          echo "Waiting for PackageManager service..."
          for i in $(seq 1 36); do
            if adb shell pm path android >/dev/null 2>&1; then
              echo "PackageManager ready after ~$((i*5))s"
              break
            fi
            sleep 5
          done
          # 安装带重试：system_server 在资源紧张的 runner 上可能反复崩溃，
          # 每次重试前重新确认 pm 服务可用，最多 8 次。
          INSTALLED=0
          for i in $(seq 1 8); do
            if ! adb shell pm path android >/dev/null 2>&1; then
              echo "pm service not ready before attempt $i, waiting..."
              for j in $(seq 1 12); do
                adb shell pm path android >/dev/null 2>&1 && break
                sleep 5
              done
            fi
            if adb install -t apk/app-debug.apk; then
              INSTALLED=1
              break
            fi
            echo "adb install attempt $i failed, retrying..."
            sleep 15
          done
          if [ "$INSTALLED" != "1" ]; then
            echo "ERROR: failed to install APK after 8 attempts"
            exit 1
          fi
          adb shell pm grant com.snoresleep.monitor android.permission.RECORD_AUDIO
          adb shell am start -n com.snoresleep.monitor/.MainActivity
          sleep 15
          PID=$(adb shell pidof com.snoresleep.monitor || true)
          if [ -z "$PID" ]; then
            echo "ERROR: com.snoresleep.monitor is not running"
            exit 1
          fi
          echo "App is running, PID=$PID"
          adb logcat -d > logcat.txt || touch logcat.txt
          # 红屏检测只针对本应用相关日志（ReactNativeJS 标签 / 应用包名）。
          # 不能全量 grep FATAL EXCEPTION——资源紧张的模拟器里系统服务也会崩溃，
          # 那些行与应用无关，会造成误报。
          APPLOG=$(grep -E "ReactNativeJS|com\\.snoresleep\\.monitor" logcat.txt || true)
          if echo "$APPLOG" | grep -qE "Unable to load script|Could not get BatchedBridge|FATAL EXCEPTION"; then
            echo "ERROR: JS bundle failed to load (red screen signatures found in app logcat)"
            echo "$APPLOG" | grep -E "Unable to load script|Could not get BatchedBridge|FATAL EXCEPTION" | head -20
            exit 1
          fi
          echo "JS bundle loaded OK"
          adb shell screencap -p /sdcard/screen.png || true
          adb pull /sdcard/screen.png screen.png || touch screen.png
          EOF
          chmod +x emulator-test.sh

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # runner 内置的 disable-animations 会在 boot 完成后立刻调 settings，
          # 模拟器刚启动时 adbd 偶发 Broken pipe(32) 并让整个步骤以 224 退出。
          # 改为关闭它，由下面的 script 做带重试的 adb 配置。
          disable-animations: false
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          emulator-boot-timeout: 600
          script: |
            #!/bin/sh
            set -eu
            setup_log=/tmp/emulator-adb-setup.log

            # adb 在资源紧张的 runner 上会短暂掉线（device offline / Broken pipe），
            # 所以 boot 确认与 settings 写入都放在可重试的整段里执行。
            is_booted() {
              val=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r ')
              [ "$val" = "1" ]
            }

            configure_once() {
              timeout 60 adb wait-for-device || return 1
              i=0
              while [ "$i" -lt 24 ]; do
                if is_booted; then
                  echo "boot_completed=1 after about $((i * 5))s"
                  break
                fi
                i=$((i + 1))
                sleep 5
              done
              if ! is_booted; then
                echo "boot_completed still not 1 after 120s"
                return 1
              fi
              adb shell settings put global window_animation_scale 0.0 || return 1
              adb shell settings put global transition_animation_scale 0.0 || return 1
              adb shell settings put global animator_duration_scale 0.0 || return 1
              adb shell settings put system screen_off_timeout 2147483647 || return 1
            }

            ok=0
            for attempt in 1 2 3; do
              echo "== adb configure attempt $attempt/3 =="
              if configure_once >"$setup_log" 2>&1; then
                cat "$setup_log"
                ok=1
                break
              fi
              echo "attempt $attempt failed, last output:"
              cat "$setup_log" || true
              if [ "$attempt" -lt 3 ]; then
                echo "retrying in 10s"
                sleep 10
              fi
            done

            if [ "$ok" != "1" ]; then
              echo "ERROR: adb configuration failed after 3 attempts"
              adb devices || true
              exit 1
            fi

            echo "adb configuration applied, running smoke test"
            ./emulator-test.sh

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-logs
          path: |
            logcat.txt
            screen.png
